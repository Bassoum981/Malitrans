# ===================================================================
# CONFIGURATION DE L'APPLICATION MALI-TRANS
# ===================================================================
spring.application.name=malitrans

# Port du serveur backend
server.port=8080

# ===================================================================
# CONFIGURATION DE LA BASE DE DONNÉES (MYSQL)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/malitrans_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password

# ===================================================================
# CONFIGURATION JPA / HIBERNATE
# ===================================================================
# update : met à jour le schéma automatiquement sans supprimer les données (idéal pour le dev de nuit)
# validate ou create-drop selon vos préférences par la suite
spring.jpa.hibernate.ddl-auto=update

# Afficher les requêtes SQL dans la console pour le débogage (mettre à false en production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecte MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ===================================================================
# CONFIGURATION CORS (Pour autoriser votre future app Flutter)
# ===================================================================
# Vous pourrez affiner les origines autorisées plus tard
management.endpoints.web.exposure.include=*
